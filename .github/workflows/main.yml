name: Auto Renew NYT Pass

on:
  schedule:
    - cron: '1 3 * * *' # Runs at 12am LA time
  workflow_dispatch:

jobs:
  renew-pass:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Renewal Script
        env:
          # We must map the GitHub Secret to the Python Environment Variable here
          LIBRARY_CARD: ${{ secrets.LIBRARY_CARD }}
          LIBRARY_PIN: ${{ secrets.LIBRARY_PIN }}
          NYT_COOKIE: ${{ secrets.NYT_COOKIE }}
        run: python main.py
